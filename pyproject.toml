[project]
name = "youtube-sync-tool"
version = "1.0.1"
description = "Sync YouTube watch history to Obsidian Vault using Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "mcp>=1.28.1",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2026.6.9"
]

[dependency-groups]
dev = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.6",
    "pytest>=9.0.3",
    "pytest-mock>=3.12.0",
    "responses>=0.24.1",
]
