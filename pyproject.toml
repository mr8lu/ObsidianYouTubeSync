[project]
name = "youtube-sync-tool"
version = "1.0.1"
description = "Sync YouTube watch history to Obsidian Vault using Gemini"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-genai>=0.3.0",
    "mcp>=1.2.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "tenacity>=8.2.0",
    "youtube-transcript-api>=0.6.2",
    "yt-dlp>=2025.2.19"
]

[dependency-groups]
dev = [
    "pytest>=7.4.3",
    "pytest-mock>=3.12.0",
    "responses>=0.24.1"
]
